<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个基于浏览器本地存储的轻量动态分享应用">
  <title>Mini Feed · 记录此刻</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231D9BF0'/%3E%3Cpath d='M8 10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-6 4v-4a2 2 0 0 1-2-2V10Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6.5C4 5.67 4.67 5 5.5 5H18.5C19.33 5 20 5.67 20 6.5V15C20 15.83 19.33 16.5 18.5 16.5H10L5.5 20V16.5C4.67 16.5 4 15.83 4 15V6.5Z" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Mini Feed</h1>
          <p>记录此刻，分享想法</p>
        </div>
      </div>
      <span class="header-badge">本地存储 · 无需登录</span>
    </header>

    <main>
      <section class="composer card" aria-labelledby="composer-title">
        <h2 id="composer-title" class="section-title">有什么新鲜事？</h2>
        <label class="sr-only" for="post-input">动态内容</label>
        <textarea id="post-input" maxlength="280" rows="4" placeholder="写下你此刻的想法…"></textarea>
        <div class="composer-footer">
          <span id="char-count" class="char-count" aria-live="polite">0 / 280</span>
          <button id="publish-btn" type="button" disabled>发布</button>
        </div>
      </section>

      <section class="timeline-section" aria-labelledby="timeline-title">
        <div class="timeline-heading">
          <h2 id="timeline-title" class="section-title">时间线</h2>
          <span id="post-count" class="post-count">0 条动态</span>
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">✦</span>
          <p>还没有任何动态</p>
          <p class="empty-hint">在上面写下第一条内容吧</p>
        </div>
        <div id="timeline" class="timeline" role="list"></div>
      </section>
    </main>

    <footer class="app-footer">数据仅保存在当前浏览器中</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
